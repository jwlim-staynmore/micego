# MICEGO Supabase 프로젝트 설정. SPEC_LAUNCH.md §4 "supabase/config.toml [auth]" 를 그대로 반영한다.
# `supabase link` 로 실제 프로젝트에 연결한 뒤 `supabase db push` / `supabase functions deploy` 로 배포한다.
project_id = "micego"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://micego.kr"
additional_redirect_urls = ["https://micego.kr/ko/reset.html", "https://micego.kr/ko/signup.html"]
jwt_expiry = 3600
# 회원은 signup_start Edge Function 을 통해서만 생성된다 (auth.admin.createUser, email_confirm=false로 시작).
# 클라이언트의 supabase-js signUp() 직접 호출은 막는다.
enable_signup = false
enable_confirmations = true
minimum_password_length = 10

[auth.email]
enable_signup = false
enable_confirmations = true
# 가입/이메일변경 인증코드, 비밀번호 재설정 링크 모두 우리가 직접 OTP 테이블 + Edge Function 으로 관리하고
# (SPEC_LAUNCH.md §4 OTP storage), Supabase 내장 이메일 발송은 쓰지 않는다 (Resend 로 대체 발송).
# 그럼에도 GoTrue 내부의 토큰 만료 설정은 우리 쪽 OTP 만료 시간과 맞춰 둔다.
otp_expiry = 1800
otp_length = 6

[auth.sms]
enable_signup = false
enable_confirmations = false
# 한국 통신사 발신번호 사전등록이 필요한 SMS OTP 는 Supabase Auth phone-OTP 가 아니라
# 자체 otp_codes 테이블 + Solapi/Aligo 어댑터로 처리한다 (SPEC_ACCOUNTS.md B, settings.html 전제 조건 참고).

[auth.external.email]
enabled = false

# ---------- pg_cron / pg_net (0007_cron.sql 이 guard 로 감싸 조건부 생성) ----------
# 실제 배포에서는 Supabase 대시보드에서 두 확장을 켠 뒤 마이그레이션을 적용하면
# mg-dispatch-notifications(매분) / mg-system-tick(10분) 크론 작업이 자동으로 등록된다.

# ---------- Edge Functions ----------
# 기본값(verify_jwt = true)은 그대로 둔다 — 익명 호출도 apikey + Authorization: Bearer <anonKey> 를 보내므로
# (anon key 자체가 유효한 JWT) 게이트웨이 검증을 그대로 통과한다. dispatch_notifications 만 예외:
# pg_cron 이 x-cron-secret 헤더만 들고 호출하므로 게이트웨이 JWT 검증을 끄고, 함수 내부에서 직접 시크릿을 비교한다.
[functions.dispatch_notifications]
verify_jwt = false

# 피드백 위젯/contact.html 은 단순 CORS 요청(D1)으로 호출한다 — apikey/Authorization 헤더를 붙이면
# preflight(OPTIONS)가 생겨 카카오 인앱 등 구형 WebView에서 유실되는 경로가 생기기 때문이다(D2).
# 인증은 함수 안에서 본문 auth.access_token 을 직접 검증한다. SPEC_FEEDBACK.md D1/D2, §3.1.
[functions.feedback-submit]
verify_jwt = false

# cron(x-internal-secret) 또는 콘솔의 운영자 JWT(본문 Bearer) 단건 재발송 — 게이트웨이 JWT 검증은 끄고
# 함수 내부에서 직접 인증한다. SPEC_FEEDBACK.md §3.10.
[functions.feedback-mail-retry]
verify_jwt = false

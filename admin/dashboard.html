<!DOCTYPE html>
<html lang="ko">
<head>
<script>window.__mgfbEarly=[];addEventListener('error',function(e){__mgfbEarly.length<3&&__mgfbEarly.push({t:new Date().toISOString(),m:String(e.message).slice(0,500),s:e.filename,l:e.lineno+':'+e.colno})});</script>
<meta charset="UTF-8">
<meta name="micego-build" content="2026.09.27-0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>대시보드 | MICEGO 운영 콘솔</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230F1E3D'/%3E%3Crect x='6.5' y='9' width='14' height='2.6' rx='1.3' fill='%23FFFFFF'/%3E%3Crect x='6.5' y='14.7' width='11' height='2.6' rx='1.3' fill='%2316B5A8'/%3E%3Crect x='6.5' y='20.4' width='8' height='2.6' rx='1.3' fill='%23FFC24B'/%3E%3Ccircle cx='24.5' cy='16' r='2.6' fill='%23FFFFFF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="app"></div>
<noscript><p class="nojs">이 화면은 JavaScript가 있어야 표시됩니다. 브라우저 설정에서 JavaScript를 켜 주세요.</p></noscript>
<script src="../assets/config.js"></script>
<script src="../assets/mg.js"></script>
<script src="../assets/feedback.js" defer></script>
<script src="data-adapter.js"></script>
<script src="admin.js"></script>
<script src="partner.js"></script>
<script>
(function(){
var A=MICEGO;
A.boot('dashboard','대시보드',function(main){
  function render(){
    var S=A.data(), todo=A.todo();
    var todoH=todo.map(function(t){
      var cls=t.n===0?'zero':'';
      var nc=t.key==='sla-red'||t.key==='failed'||t.key==='partner'?'':'amber';
      return '<li class="'+cls+'"><a href="'+t.href+'" data-key="'+t.key+'"><span class="n '+nc+'">'+t.n+'</span><span class="t">'+A.esc(t.title)+'</span><span class="go">'+(t.n?'보기 →':'')+'</span><span class="a">'+A.esc(t.act)+'</span></a></li>';
    }).join('');
    var counts={},total=0;
    A.PIPELINE.forEach(function(s){counts[s]=S.rfps.filter(function(r){return r.state===s;}).length;total+=counts[s];});
    var colors={received:'#A0AAC2',verifying:'#4A78E0',open:'#16B5A8',bidding:'#0B8F86',collecting:'#FFC24B',delivered:'#7B6BE0'};
    var txt={received:'#0F1E3D',verifying:'#fff',open:'#0F1E3D',bidding:'#fff',collecting:'#0F1E3D',delivered:'#fff'};
    var dist=A.PIPELINE.filter(function(s){return counts[s]>0;}).map(function(s){return '<span style="flex:'+counts[s]+';background:'+colors[s]+';color:'+txt[s]+'" title="'+A.STATES[s]+' '+counts[s]+'건">'+counts[s]+'</span>';}).join('');
    var legend=A.PIPELINE.map(function(s){return '<div><i style="background:'+colors[s]+'"></i><span>'+A.STATES[s]+' <b>'+counts[s]+'</b></span></div>';}).join('');
    var m=S.metrics;
    var metricH=m.items.map(function(x){
      var st=x.met===true?'충족':x.met===false?'미달':'추적';
      var cl=x.met===true?'met':x.met===false?'unmet':'';
      return '<div class="metric"><div class="nm">'+A.esc(x.name)+'</div><div class="v">'+A.esc(x.value)+'</div><div class="sb">'+A.esc(x.sub)+'</div><div class="tg"><span class="dot '+cl+'" aria-hidden="true"></span><span><b class="st '+cl+'">'+st+'</b> · '+A.esc(x.target)+'</span></div></div>';
    }).join('');
    var failH=S.failures.map(function(f){
      return '<tr><td style="overflow-wrap:anywhere">'+A.esc(f.to)+'<div class="small muted"><a href="rfp.html?id='+f.rfpId+'" class="mono">'+f.rfpId+'</a></div></td><td>'+A.esc(f.template)+'</td><td>'+A.fmtDT(f.at)+'</td><td><label class="toggle"><input type="checkbox" data-fail="'+f.id+'"'+(f.manual?' checked':'')+'> 직접 보냄</label></td></tr>';
    }).join('');
    var hist=[];
    S.rfps.forEach(function(r){r.history.forEach(function(h){hist.push({r:r,h:h});});});
    hist.sort(function(a,b){return b.h.t-a.h.t;});
    var histH=hist.slice(0,8).map(function(x){
      var h=x.h,tr=h.to?(h.from?A.chip(h.from)+' → ':'')+A.chip(h.to):'<span class="muted">메모</span>';
      return '<tr><td class="mono" style="white-space:nowrap">'+A.fmtDT(h.t)+'</td><td><a class="mono rowlink" href="rfp.html?id='+x.r.id+'">'+x.r.id+'</a></td><td>'+A.esc(h.actor)+'</td><td style="white-space:nowrap">'+tr+'</td><td>'+A.esc(h.memo)+'</td></tr>';
    }).join('');
    var lp=A.linkPending().length,lk=A.lockedCount();
    var accH='<a href="members.html?filter=link" data-key="linkreq" class="'+(lp?'':'zero')+'"><span class="n">'+lp+'</span><span class="t">연결 요청 대기 '+lp+'건</span></a><a href="members.html?state=locked" data-key="locked" class="'+(lk?'':'zero')+'"><span class="n">'+lk+'</span><span class="t">잠긴 계정 '+lk+'건</span></a>';
    if(A.isPartner()){
      main.innerHTML='<div class="page-h"><h1>대시보드</h1><span class="muted small sp">기준 시각 '+A.fmtDT(A.NOW)+' KST</span></div>'+
        MICEGO_PTR.partnerSummary()+
        '<div style="margin-top:16px">'+MICEGO_PTR.interventionWidget()+'</div>'+
        '<div class="grid2" style="margin-top:16px"><section class="card" aria-labelledby="h-todo"><h2 id="h-todo">오늘 할 일</h2><p class="sub">숫자를 누르면 해당 견적만 모아 봅니다.</p><ul class="todo">'+todoH+'</ul></section>'+
        '<section class="card" aria-labelledby="h-dist"><h2 id="h-dist">진행 중 상태 분포</h2><p class="sub">접수됨부터 전달됨까지 '+total+'건</p><div class="dist" role="img" aria-label="상태 분포">'+dist+'</div><div class="legend">'+legend+'</div></section></div>'+
        '<section class="card" style="margin-top:16px" aria-labelledby="h-h"><h2 id="h-h">최근 이력</h2><div class="tbl-wrap"><table><thead><tr><th>시각</th><th>견적</th><th>주체</th><th>상태</th><th>메모</th></tr></thead><tbody>'+histH+'</tbody></table></div></section>';
      return;
    }
    main.innerHTML=
      '<div class="page-h"><h1>대시보드</h1><span class="muted small sp">기준 시각 '+A.fmtDT(A.NOW)+' KST</span></div>'+
      '<div style="margin-bottom:16px">'+MICEGO_PTR.interventionWidget()+'</div>'+
      '<div class="grid2"><section class="card" aria-labelledby="h-todo"><h2 id="h-todo">오늘 할 일</h2><p class="sub">SOP 일일 루틴 순서입니다. 숫자를 누르면 해당 견적만 모아 봅니다.</p><ul class="todo">'+todoH+'</ul></section>'+
      '<section class="card" aria-labelledby="h-dist"><h2 id="h-dist">진행 중 상태 분포</h2><p class="sub">접수됨부터 전달됨까지 '+total+'건</p><div class="dist" role="img" aria-label="상태 분포">'+dist+'</div><div class="legend">'+legend+'</div></section></div>'+
      '<section class="card" style="margin-top:16px" aria-labelledby="h-ac"><h2 id="h-ac">회원 계정</h2><p class="sub">여행사·기업 담당자 계정 현황입니다. 숫자를 누르면 해당 회원만 모아 봅니다.</p><div class="acc-sum" id="accSum">'+accH+'</div></section>'+
      '<section class="card" style="margin-top:16px" aria-labelledby="h-m"><h2 id="h-m">지난달 지표 · '+m.month+' · 예시 데이터</h2><p class="sub">접수 '+m.base+'건 기준입니다. 색만이 아니라 글자로도 충족/미달을 표시합니다.</p><div class="metrics">'+metricH+'</div></section>'+
      '<section class="card" style="margin-top:16px" id="failures" aria-labelledby="h-f"><h2 id="h-f">발송 실패 <span class="badge red">'+A.failedCount()+'건 미처리</span></h2><p class="sub">notification.failed 목록입니다. 주소 오타를 확인하고 직접 메일을 보낸 뒤 표시하세요.</p><p class="small" style="margin:-6px 0 12px"><a href="settings.html#notify" id="allLog">전체 발송 로그 →</a></p><div class="tbl-wrap"><table><thead><tr><th>수신 주소</th><th>템플릿</th><th>시각</th><th>처리</th></tr></thead><tbody>'+failH+'</tbody></table></div></section>'+
      '<section class="card" style="margin-top:16px" aria-labelledby="h-h"><h2 id="h-h">최근 이력</h2><div class="tbl-wrap"><table><thead><tr><th>시각</th><th>견적</th><th>주체</th><th>상태</th><th>메모</th></tr></thead><tbody>'+histH+'</tbody></table></div></section>';
  }
  main.addEventListener('click',function(e){
    var b=e.target.closest('button[data-int]');if(!b)return;
    var id=b.getAttribute('data-int'),S=A.data();
    A.memoDialog('개입 처리 완료','처리 내용','무엇을 확인·조치했는지 적어 주세요. 이력에 남습니다.','완료',true).then(function(m){
      if(m===null)return;
      A.persist('intervention_resolve',{p_id:Number(id),p_resolution:m,p_snooze_hours:null},function(){S.interventions=S.interventions.filter(function(a){return String(a.id)!==String(id);});}).then(function(ok){if(ok){A.toast('처리 완료로 표시했습니다','ok');render();}});
    });
  });
  main.addEventListener('change',function(e){
    var id=e.target.getAttribute&&e.target.getAttribute('data-fail'); if(!id)return;
    var f=A.data().failures.filter(function(x){return x.id===id;})[0],checked=e.target.checked;
    A.persist('admin_delivery_resolve',{p_log_id:id,p_manual:checked},function(){f.manual=checked;}).then(function(ok){
      if(!ok)return;
      A.toast(f.manual?'직접 보냄으로 표시했습니다':'표시를 해제했습니다','ok'); render();
      var again=main.querySelector('[data-fail="'+id+'"]'); if(again)again.focus();
    });
  });
  render();
});
})();

</script>
</body>
</html>

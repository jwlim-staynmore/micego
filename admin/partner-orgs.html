<!DOCTYPE html>
<html lang="ko">
<head>
<script>window.__mgfbEarly=[];addEventListener('error',function(e){__mgfbEarly.length<3&&__mgfbEarly.push({t:new Date().toISOString(),m:String(e.message).slice(0,500),s:e.filename,l:e.lineno+':'+e.colno})});</script>
<meta charset="UTF-8">
<meta name="micego-build" content="2026.09.27-0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지역 파트너 | MICEGO 운영 콘솔</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230F1E3D'/%3E%3Crect x='6.5' y='9' width='14' height='2.6' rx='1.3' fill='%23FFFFFF'/%3E%3Crect x='6.5' y='14.7' width='11' height='2.6' rx='1.3' fill='%2316B5A8'/%3E%3Crect x='6.5' y='20.4' width='8' height='2.6' rx='1.3' fill='%23FFC24B'/%3E%3Ccircle cx='24.5' cy='16' r='2.6' fill='%23FFFFFF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="app"></div>
<noscript><p class="nojs">이 화면은 JavaScript가 있어야 표시됩니다. 브라우저 설정에서 JavaScript를 켜 주세요.</p></noscript>
<script src="../assets/config.js"></script>
<script src="../assets/mg.js"></script>
<script src="../assets/feedback.js" defer></script>
<script src="data-adapter.js"></script>
<script src="admin.js"></script>
<script src="partner.js"></script>
<script>
(function(){

var A=MICEGO,esc=A.esc,P=MICEGO_PTR;
A.boot('partner-orgs','지역 파트너',function(main){
  var code=new URLSearchParams(location.search).get('code')||'';
  if(!A.isOperator()){main.innerHTML='<div class="empty card"><h1>운영자만 볼 수 있는 화면입니다</h1><a class="btn primary" href="dashboard.html">대시보드로</a></div>';return;}
  function list(){
    var orgs=A.data().partnerOrgs||[];
    var rows=orgs.map(function(o){
      var rg=(o.regions||[]).filter(function(x){return x.active;}).map(function(x){return esc(x.code)+(x.primary?'':'(백업)');}).join(', ');
      var users=(o.users||[]).filter(function(u){return u.status!=='disabled';}).length;
      return '<tr><td><a class="rowlink" href="partner-orgs.html?code='+esc(o.code)+'"><b>'+esc(o.displayName)+'</b></a><div class="small muted mono">'+esc(o.code)+' · '+esc(o.legalName||'')+'</div></td><td>'+P.orgChip(o.status)+(o.acceptingNew===false?' <span class="badge amber">신규 중지</span>':'')+'</td><td>'+(rg||'<span class="muted">—</span>')+'</td><td class="num">'+(o.sharePct!=null?o.sharePct+'%':'—')+'</td><td class="num">'+(o.activeRfps||0)+(o.maxActiveRfps?' / '+o.maxActiveRfps:'')+'</td><td class="num">'+users+' / '+(o.maxAccounts||10)+'</td><td>'+esc(o.contactName||'')+'<div class="small muted">'+esc(o.contactEmail||'')+'</div></td></tr>';
    }).join('');
    main.innerHTML='<div class="page-h"><h1>지역 파트너</h1><span class="muted small">'+orgs.length+'곳</span><div class="sp"><button type="button" class="btn primary" id="newOrg">지역 파트너 등록</button></div></div>'+
      '<p class="sub">지역 파트너는 담당 지역의 요청을 접수부터 성사까지 직접 운영하고, 정산에서 수익을 나눕니다. 지역별 주 담당은 하나, 백업은 여럿일 수 있습니다.</p>'+
      '<div class="tbl-wrap"><table><thead><tr><th>파트너</th><th>상태</th><th>담당 지역</th><th class="num">배분</th><th class="num">진행 중</th><th class="num">계정</th><th>담당자</th></tr></thead><tbody>'+(rows||'<tr><td colspan="7" class="muted">등록된 지역 파트너가 없습니다.</td></tr>')+'</tbody></table></div>';
    document.getElementById('newOrg').onclick=function(){P.dlgOrgEdit(null).then(function(v){if(v)P.saveOrg(v,list,'등록했습니다. 지역을 설정하고 계정을 초대한 뒤 활성화하세요');});};
  }
  var org;
  function detail(){
    org=(A.data().partnerOrgs||[]).filter(function(o){return o.code===code;})[0];
    if(!org){main.innerHTML='<div class="empty card"><h1>해당 파트너를 찾을 수 없습니다</h1><a class="btn primary" href="partner-orgs.html">목록으로</a></div>';return;}
    document.title=org.displayName+' | MICEGO 운영 콘솔';
    var rf=A.data().rfps.filter(function(r){return r.partner&&r.partner.code===org.code&&A.TERMINAL.indexOf(r.state)<0;});
    var rfRows=rf.slice(0,10).map(function(r){return '<tr><td><a class="mono rowlink" href="rfp.html?id='+r.id+'">'+r.id+'</a></td><td>'+A.chip(r.state)+'</td><td>'+esc(r.destination)+' · '+esc(r.eventType)+'</td><td>'+P.delegChip(r)+'</td></tr>';}).join('');
    var st=(A.data().settlements||[]).filter(function(s){return s.partner&&s.partner.code===org.code&&['completed','voided'].indexOf(s.status)<0;});
    main.innerHTML='<p class="crumb"><a href="partner-orgs.html">← 지역 파트너</a></p><div class="dh"><h1>'+esc(org.displayName)+'</h1>'+P.orgChip(org.status)+'<div class="dh-act"><a class="btn" href="settlements.html">정산</a><a class="btn" href="partner-orgs.html">목록으로</a></div></div>'+
      '<div class="stack" style="margin-top:16px">'+P.orgInfoCard(org)+P.orgUsersCard(org)+
      '<section class="card"><h2>진행 중 요청 <span class="muted small">'+rf.length+'건</span> · 미완료 정산 <span class="muted small">'+st.length+'건</span></h2>'+(rfRows?'<div class="tbl-wrap"><table><thead><tr><th>요청</th><th>상태</th><th>목적지 · 유형</th><th>위임</th></tr></thead><tbody>'+rfRows+'</tbody></table></div>':'<p class="muted small">진행 중인 위임 건이 없습니다.</p>')+'<p class="small" style="margin-top:8px"><a href="rfps.html?deleg=delegated&region='+esc((org.regions[0]||{}).code||'')+'">견적 관리에서 보기 →</a></p></section></div>';
  }
  function render(){code?detail():list();}
  A.onChange=render;
  main.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b||!org)return;
    if(b.hasAttribute('data-org')){P.handleOrgAction(b,org,render);return;}
    if(b.hasAttribute('data-usr')){P.handleUserAction(b,org,render);return;}
  });
  render();
});

})();
</script>
</body>
</html>
